services:
  aidecepticon:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PORT: 8787
      DATA_DIR: /data
      PUBLIC_BASE_URL: http://localhost:8787
      SENSOR_COMMAND_SIGNING_KEY: ${SENSOR_COMMAND_SIGNING_KEY:?set SENSOR_COMMAND_SIGNING_KEY to a random value}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-local}
      SECRET_LOCAL_KEY_ID: ${SECRET_LOCAL_KEY_ID:-primary}
      SECRET_LOCAL_KEYS: ${SECRET_LOCAL_KEYS:-}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      VAULT_TRANSIT_MOUNT: ${VAULT_TRANSIT_MOUNT:-transit}
      VAULT_TRANSIT_KEY: ${VAULT_TRANSIT_KEY:-aidecepticon}
      AWS_REGION: ${AWS_REGION:-}
      AWS_KMS_KEY_ID: ${AWS_KMS_KEY_ID:-}
      AWS_KMS_ENDPOINT: ${AWS_KMS_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AUDIT_SIGNING_KEY_ID: ${AUDIT_SIGNING_KEY_ID:-primary}
      AUDIT_SIGNING_KEYS: ${AUDIT_SIGNING_KEYS:-}
      BACKUP_ENCRYPTION_KEY_ID: ${BACKUP_ENCRYPTION_KEY_ID:-primary}
      BACKUP_ENCRYPTION_KEYS: ${BACKUP_ENCRYPTION_KEYS:-}
      BACKUP_DIR: /data/backups
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-14}
      BACKUP_SCHEDULE_INTERVAL_HOURS: ${BACKUP_SCHEDULE_INTERVAL_HOURS:-0}
      BACKUP_MAX_ARCHIVE_BYTES: ${BACKUP_MAX_ARCHIVE_BYTES:-536870912}
      BACKUP_MAX_SNAPSHOT_BYTES: ${BACKUP_MAX_SNAPSHOT_BYTES:-1073741824}
      CONTROLLER_INSTANCE_ID: ${CONTROLLER_INSTANCE_ID:-}
      CONTROLLER_ZONE: ${CONTROLLER_ZONE:-local-compose}
      CONTROLLER_ADVERTISE_URL: ${CONTROLLER_ADVERTISE_URL:-}
      HA_HEARTBEAT_INTERVAL_MS: ${HA_HEARTBEAT_INTERVAL_MS:-5000}
      HA_STALE_AFTER_MS: ${HA_STALE_AFTER_MS:-20000}
      HA_LEADER_LOCK_ID: ${HA_LEADER_LOCK_ID:-84632020}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-5000}
      AUTH_MODE: ${AUTH_MODE:-disabled}
      AUTH_PROVIDER_LABEL: ${AUTH_PROVIDER_LABEL:-Enterprise SSO}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      AUTH_REQUIRE_MFA: ${AUTH_REQUIRE_MFA:-false}
      AUTH_DEFAULT_ROLE: ${AUTH_DEFAULT_ROLE:-auditor}
      AUTH_GROUPS_CLAIM: ${AUTH_GROUPS_CLAIM:-groups}
      AUTH_ROLE_CLAIM: ${AUTH_ROLE_CLAIM:-aidecepticon_role}
      AUTH_ORGANIZATIONS_CLAIM: ${AUTH_ORGANIZATIONS_CLAIM:-aidecepticon_organizations}
      AUTH_DEFAULT_ORGANIZATION_ID: ${AUTH_DEFAULT_ORGANIZATION_ID:-org-default}
      AUTH_ROLE_MAPPINGS: ${AUTH_ROLE_MAPPINGS:-{}}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email groups}
      OIDC_REQUIRED_ACR: ${OIDC_REQUIRED_ACR:-}
      OIDC_MFA_AMR_VALUES: ${OIDC_MFA_AMR_VALUES:-mfa,otp,hwk,swk}
      SAML_ENTRY_POINT: ${SAML_ENTRY_POINT:-}
      SAML_ISSUER: ${SAML_ISSUER:-}
      SAML_IDP_CERT: ${SAML_IDP_CERT:-}
      SAML_REQUIRED_AUTHN_CONTEXT: ${SAML_REQUIRED_AUTHN_CONTEXT:-}
      SAML_MFA_ATTRIBUTE: ${SAML_MFA_ATTRIBUTE:-}
      SAML_MFA_VALUES: ${SAML_MFA_VALUES:-true,mfa}
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:-}
      CONTROL_PLANE_API_PERMISSIONS: ${CONTROL_PLANE_API_PERMISSIONS:-*}
      CONTROL_PLANE_API_ORGANIZATIONS: ${CONTROL_PLANE_API_ORGANIZATIONS:-org-default}
      DATABASE_URL: postgresql://aidecepticon:${POSTGRES_PASSWORD:-aidecepticon-local-change-me}@postgres:5432/aidecepticon
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - aidecepticon-data:/data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 35s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aidecepticon
      POSTGRES_USER: aidecepticon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidecepticon-local-change-me}
    volumes:
      - aidecepticon-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U aidecepticon -d aidecepticon]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec]
    volumes:
      - aidecepticon-redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  aidecepticon-data:
  aidecepticon-postgres:
  aidecepticon-redis:
