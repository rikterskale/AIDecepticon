name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Control plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  projection-sensor:
    name: Projection sensor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sensor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: sensor/go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build -trimpath -o bin/aidecepticon-sensor ./cmd/aidecepticon-sensor

  guided-gui:
    name: Guided GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser-test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [control-plane, projection-sensor, guided-gui]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build control plane
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: aidecepticon-control-plane:ci
      - name: Build projection sensor
        uses: docker/build-push-action@v7
        with:
          context: sensor
          file: sensor/Dockerfile
          push: false
          tags: aidecepticon-sensor:ci
