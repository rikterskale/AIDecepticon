name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Control plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  projection-sensor:
    name: Projection sensor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sensor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: sensor/go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build -trimpath -o bin/aidecepticon-sensor ./cmd/aidecepticon-sensor

  guided-gui:
    name: Guided GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser-test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  production-infrastructure:
    name: PostgreSQL and Redis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aidecepticon
          POSTGRES_USER: aidecepticon
          POSTGRES_PASSWORD: integration-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidecepticon -d aidecepticon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://aidecepticon:integration-test-password@127.0.0.1:5432/aidecepticon
      DATABASE_SSL: disable
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- server/sensor-api.test.js server/command-queue.test.js server/auth.test.js server/audit.test.js server/secret-manager.test.js server/tenancy.test.js

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [control-plane, projection-sensor, guided-gui, production-infrastructure]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build control plane
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: aidecepticon-control-plane:ci
      - name: Build projection sensor
        uses: docker/build-push-action@v7
        with:
          context: sensor
          file: sensor/Dockerfile
          push: false
          tags: aidecepticon-sensor:ci
