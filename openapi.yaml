openapi: 3.1.0
info:
  title: AIDecepticon Control Plane API
  version: 0.1.0
  description: API for managing deception deployments, sensors, tokens, incidents, encrypted secrets, audit events, identity domains, and integrations.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8787/api/v1
security:
  - controlPlaneSession: []
  - controlPlaneBearer: []
paths:
  /health:
    get:
      security: []
      operationId: getHealth
      summary: Read service and infrastructure health
      responses:
        '200':
          description: Control plane, storage, and queue are healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: A configured infrastructure dependency is degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /auth/config:
    get:
      security: []
      operationId: getAuthenticationConfig
      summary: Read the configured sign-in mode and available roles
      responses:
        '200': { description: Authentication configuration }
  /auth/session:
    get:
      security: []
      operationId: getAuthenticationSession
      summary: Read the current operator identity and permissions
      responses:
        '200': { description: Current authentication session }
  /auth/login:
    get:
      security: []
      operationId: beginEnterpriseLogin
      summary: Begin OIDC or SAML authentication
      parameters:
        - name: returnTo
          in: query
          schema: { type: string, default: / }
      responses:
        '302': { description: Redirect to the configured identity provider }
  /auth/api-key:
    post:
      security: []
      operationId: createApiKeySession
      summary: Exchange the configured control-plane API key for a GUI session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey]
              properties:
                apiKey: { type: string, format: password }
      responses:
        '200': { description: Server-side GUI session created }
        '401': { description: API key invalid }
        '404': { description: API-key sign-in is not configured }
  /auth/logout:
    post:
      operationId: destroyAuthenticationSession
      summary: Destroy the current operator session
      responses:
        '204': { description: Session destroyed }
  /auth/oidc/callback:
    get:
      security: []
      operationId: completeOidcLogin
      summary: Validate an OIDC authorization response
      responses:
        '302': { description: Session created and operator returned to the GUI }
        '400': { description: Authentication transaction invalid or expired }
  /auth/saml/callback:
    post:
      security: []
      operationId: completeSamlLogin
      summary: Validate a signed SAML response
      responses:
        '302': { description: Session created and operator returned to the GUI }
        '400': { description: Authentication transaction invalid or expired }
  /auth/saml/metadata:
    get:
      security: []
      operationId: getSamlMetadata
      summary: Download service-provider metadata for identity-provider setup
      responses:
        '200': { description: SAML service-provider metadata }
        '404': { description: SAML is not configured }
  /summary:
    get:
      operationId: getSummary
      summary: Read the command-center summary
      responses:
        '200': { description: Summary metrics }
  /deployments:
    get:
      operationId: listDeployments
      summary: List deception deployments
      responses:
        '200': { description: Deployment collection }
    post:
      operationId: createDeployment
      summary: Deploy a deception blueprint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, blueprintId, environment, location]
              properties:
                name: { type: string }
                blueprintId: { type: string }
                environment: { type: string }
                location: { type: string }
                mode: { type: string, enum: [agentless, cloud-native, sensor, package] }
                customizations: { type: object }
      responses:
        '201': { description: Deployment accepted }
        '400': { description: Invalid input }
  /tokens:
    get:
      operationId: listTokens
      summary: List deception tokens
      responses:
        '200': { description: Token collection }
    post:
      operationId: createToken
      summary: Generate a canary token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                type: { type: string, enum: [document, credential, connection, cloud-key, api-key] }
                destination: { type: string }
                metadata: { type: object }
      responses:
        '201': { description: Token generated }
  /incidents:
    get:
      operationId: listIncidents
      summary: List incidents
      responses:
        '200': { description: Incident collection }
  /incidents/{id}:
    patch:
      operationId: updateIncident
      summary: Update incident workflow state
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
                assignee: { type: string }
      responses:
        '200': { description: Incident updated }
        '404': { description: Incident not found }
  /sensors:
    get:
      operationId: listSensors
      summary: List projection sensors
      responses:
        '200': { description: Sensor collection }
  /sensor-commands:
    get:
      operationId: listSensorCommands
      summary: List sensor commands, optionally filtered by lifecycle state
      security:
        - controlPlaneSession: []
        - controlPlaneBearer: []
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200': { description: Sensor command collection }
  /sensor-commands/{commandId}/retry:
    post:
      operationId: retrySensorCommand
      summary: Replace a dead-lettered command with a new signed delivery
      security:
        - controlPlaneSession: []
        - controlPlaneBearer: []
      parameters:
        - $ref: '#/components/parameters/CommandId'
      responses:
        '201': { description: Replacement command queued }
        '404': { description: Command not found }
        '409': { description: Command is not dead-lettered }
  /sensor-commands/{commandId}/dismiss:
    post:
      operationId: dismissSensorCommand
      summary: Dismiss a dead-lettered command after operator review
      security:
        - controlPlaneSession: []
        - controlPlaneBearer: []
      parameters:
        - $ref: '#/components/parameters/CommandId'
      responses:
        '200': { description: Command dismissed }
        '404': { description: Command not found }
        '409': { description: Command is not dead-lettered }
  /sensor-enrollment-tokens:
    post:
      operationId: createSensorEnrollmentToken
      summary: Create a single-use projection-sensor enrollment token
      security:
        - controlPlaneSession: []
        - controlPlaneBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 100 }
                ttlMinutes: { type: integer, minimum: 5, maximum: 60, default: 15 }
      responses:
        '201': { description: Single-use token created }
        '401': { description: Control-plane authentication required }
  /sensors/enroll:
    post:
      security: []
      operationId: enrollSensor
      summary: Exchange a single-use token for a projection-sensor identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollmentToken, name]
              properties:
                enrollmentToken: { type: string }
                sensorId: { type: string, minLength: 3, maxLength: 64 }
                name: { type: string, maxLength: 100 }
                version: { type: string }
                platform: { type: string }
                capabilities:
                  type: array
                  items: { type: string }
      responses:
        '201': { description: Sensor enrolled; credentials are returned once }
        '401': { description: "Token invalid, expired, or used" }
        '409': { description: Sensor ID already exists }
  /sensors/{sensorId}/heartbeat:
    post:
      operationId: reportSensorHeartbeat
      summary: Report sensor health and active decoy inventory
      security:
        - sensorBearer: []
      parameters:
        - $ref: '#/components/parameters/SensorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                health: { type: number, minimum: 0, maximum: 100 }
                latency: { type: number, minimum: 0 }
                version: { type: string }
                address: { type: string }
                decoys:
                  type: array
                  items: { type: object }
      responses:
        '200': { description: Heartbeat accepted }
        '401': { description: Sensor authentication required }
  /sensors/{sensorId}/commands:
    get:
      operationId: pollSensorCommands
      summary: Poll queued, signed, unexpired commands
      security:
        - sensorBearer: []
      parameters:
        - $ref: '#/components/parameters/SensorId'
      responses:
        '200': { description: Signed command collection }
        '401': { description: Sensor authentication required }
    post:
      operationId: createSensorCommand
      summary: Queue a signed command for a projection sensor
      security:
        - controlPlaneSession: []
        - controlPlaneBearer: []
      parameters:
        - $ref: '#/components/parameters/SensorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [deploy_decoy, stop_decoy, snapshot] }
                payload: { type: object }
                maxAttempts: { type: integer, minimum: 1, maximum: 10, default: 3 }
                retryBackoffSeconds: { type: integer, minimum: 5, maximum: 300, default: 15 }
      responses:
        '201': { description: Signed command queued }
        '404': { description: Sensor not found }
  /sensors/{sensorId}/commands/{commandId}/ack:
    post:
      operationId: acknowledgeSensorCommand
      summary: Acknowledge successful or failed sensor command execution
      security:
        - sensorBearer: []
      parameters:
        - $ref: '#/components/parameters/SensorId'
        - name: commandId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [acknowledged, failed] }
                output: {}
                error: { type: string }
      responses:
        '200': { description: Command state updated }
        '404': { description: Command not found }
  /sensors/{sensorId}/events:
    post:
      operationId: ingestSensorEvent
      summary: Convert a projected-decoy interaction into an incident
      security:
        - sensorBearer: []
      parameters:
        - $ref: '#/components/parameters/SensorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decoyId, source, protocol]
              properties:
                decoyId: { type: string }
                decoyName: { type: string }
                protocol: { type: string, enum: [http, ssh, postgres, redis, smb, tcp] }
                source: { type: string }
                destination: { type: string }
                metadata: { type: object }
      responses:
        '201': { description: Event and high-confidence incident created }
        '401': { description: Sensor authentication required }
  /secrets:
    get:
      operationId: listEncryptedSecrets
      summary: List encrypted-secret metadata without ciphertext or plaintext
      responses:
        '200': { description: Secret metadata collection }
    post:
      operationId: createEncryptedSecret
      summary: Encrypt and store a provider credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value]
              properties:
                name: { type: string, maxLength: 100 }
                type: { type: string, enum: [integration, cloud, identity, response, api] }
                description: { type: string, maxLength: 300 }
                value: { type: string, format: password, maxLength: 4096 }
      responses:
        '201': { description: Secret encrypted; metadata returned without ciphertext }
        '400': { description: Invalid secret input }
  /secrets/{secretId}/rotate:
    post:
      operationId: rotateEncryptedSecret
      summary: Replace a secret with a newly encrypted value
      parameters:
        - $ref: '#/components/parameters/SecretId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string, format: password, maxLength: 4096 }
      responses:
        '200': { description: Secret value rotated; metadata returned }
        '404': { description: Secret not found }
  /secrets/{secretId}/verify:
    post:
      operationId: verifyEncryptedSecret
      summary: Decrypt server-side and compare the secret integrity fingerprint
      parameters:
        - $ref: '#/components/parameters/SecretId'
      responses:
        '200': { description: Verification result without plaintext }
        '404': { description: Secret not found }
  /audit-events:
    get:
      operationId: listAdministrativeAuditEvents
      summary: List append-only audit events and verify the HMAC chain
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200': { description: Audit events and chain verification result }
  /domains:
    get:
      operationId: listDomains
      summary: List protected identity domains
      responses:
        '200': { description: Domain collection }
  /integrations:
    get:
      operationId: listIntegrations
      summary: List security integrations
      responses:
        '200': { description: Integration collection }
  /beacon/{tokenId}:
    get:
      security: []
      operationId: triggerBeacon
      summary: Trigger a deception token interaction
      parameters:
        - name: tokenId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Interaction recorded }
        '404': { description: Token not found }
components:
  schemas:
    InfrastructureHealth:
      type: object
      required: [healthy, mode]
      properties:
        healthy: { type: boolean }
        mode: { type: string }
        error: { type: string }
    Health:
      type: object
      required: [status, version, time, infrastructure]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        time: { type: string, format: date-time }
        infrastructure:
          type: object
          required: [storage, queue, scheduler, authentication, secrets, audit]
          properties:
            storage: { $ref: '#/components/schemas/InfrastructureHealth' }
            queue: { $ref: '#/components/schemas/InfrastructureHealth' }
            scheduler: { $ref: '#/components/schemas/InfrastructureHealth' }
            authentication: { $ref: '#/components/schemas/InfrastructureHealth' }
            secrets: { $ref: '#/components/schemas/InfrastructureHealth' }
            audit: { $ref: '#/components/schemas/InfrastructureHealth' }
  securitySchemes:
    controlPlaneSession:
      type: apiKey
      in: cookie
      name: __Host-aidecepticon.sid
      description: HTTP-only server-side operator session established through OIDC, SAML, or API-key exchange.
    controlPlaneBearer:
      type: http
      scheme: bearer
      description: Optional control-plane API key configured by the administrator.
    sensorBearer:
      type: http
      scheme: bearer
      description: Unique sensor access token returned once during enrollment.
  parameters:
    SensorId:
      name: sensorId
      in: path
      required: true
      schema: { type: string }
    CommandId:
      name: commandId
      in: path
      required: true
      schema: { type: string }
    SecretId:
      name: secretId
      in: path
      required: true
      schema: { type: string, pattern: '^sec-' }
